<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Events — Freshers' guide</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="site-header" role="banner">
  <button class="hamburger" aria-label="Open navigation" aria-expanded="false" aria-controls="nav-drawer"><span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span></button>
  <button class="theme-toggle" aria-label="Switch theme" aria-pressed="false">☀</button>
</header>
<div class="drawer-overlay" aria-hidden="true"></div>
<aside class="drawer" id="nav-drawer" role="navigation" aria-label="Primary" aria-modal="false" aria-hidden="true" hidden>
  <nav><ul><li><a href="index.html">Home</a></li><li><a href="about.html">About</a></li><li><a href="events.html" class="active">Events</a></li><li><a href="faq.html">FAQ</a></li><li><a href="contact.html">Contact</a></li></ul></nav>
</aside>

<main class="events-section" role="main">
  <h1 class="page-title">Events</h1>
  <p class="events-subtitle">Workshops, contests, and social gatherings for first-year students.</p>

  <div class="events-toolbar">
    <div class="events-tabs-search-row">
      <div class="events-tabs" role="tablist" aria-label="Event views">
        <button role="tab" class="event-tab active" id="tab-upcoming" data-tab="upcoming" aria-selected="true" aria-controls="event-list">Upcoming</button>
        <button role="tab" class="event-tab" id="tab-past" data-tab="past" aria-selected="false" aria-controls="event-list">Past</button>
        <button role="tab" class="event-tab" id="tab-saved" data-tab="saved" aria-selected="false" aria-controls="event-list">Saved <span class="saved-badge" id="saved-badge" aria-label="0 saved events" hidden>0</span></button>
      </div>

      <div class="search-box">
        <svg class="search-icon" aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input 
          type="search" 
          id="event-search" 
          class="search-input" 
          placeholder="Search events or venues..." 
          aria-label="Search events" 
          autocomplete="off"
          spellcheck="false"
        >
        <button type="button" id="search-clear-btn" class="search-clear-btn" aria-label="Clear search" title="Clear search" hidden>✕</button>
      </div>
    </div>

    <div class="filters" role="group" aria-label="Filter events by category">
      <button class="filter active" data-type="All">All</button>
      <button class="filter" data-type="Workshop">Workshops</button>
      <button class="filter" data-type="Contest">Contests</button>
      <button class="filter" data-type="Social">Social</button>
    </div>
  </div>

  <div id="next-event" class="next-event-banner" aria-label="Next upcoming event"></div>
  <div id="event-list" role="region" aria-live="polite" aria-label="Events list"></div>
</main>

<footer class="site-footer" role="contentinfo"><p>Freshers' guide — student-run for first-year students. MIT licensed.</p></footer>

<script src="script.js" defer></script>
</body>
</html>
